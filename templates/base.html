<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{{url_for('static',filename='style.css')}}">
    <title>CP Tracker</title>
    <style>
        /* Initial state before animation to prevent flash */
        body { opacity: 0; }
    </style>
</head>

<body>
    <header>
        <nav>
            <a href="/">Home</a>
            <a href="/view">View</a>
            <a href="/sort" class="sort-link">Sort</a>
            <a href="/lc/roadmap" class="roadmap-link" style="display: none;">Roadmap</a>
            <a href="/coach" class="coach-link">Coach</a>
        </nav>
        <div class="retro-dropdown" style="margin-left: auto;">
            <button class="btn-add dropdown-trigger">MODE: CF ▼</button>
            <div class="dropdown-content">
                <button class="mode-btn btn-add" data-mode="cf">Codeforces</button>
                <button class="mode-btn btn-add" data-mode="lc">LeetCode</button>
                <button class="mode-btn btn-add" data-mode="gh">GitHub</button>
            </div>
        </div>
    </header>

    <main>
        {%block content%}
        {%endblock%}
    </main>

    <aside>
        <h2>TRAINER CARD</h2>
        <div class="cf-stats-container">
            <div class="stat-item">
                <span class="stat-label">Rating</span>
                <span class="stat-value" id="aside-cf-rating"><div class="skeleton skeleton-text short"></div></span>
            </div>
            <div class="stat-item">
                <span class="stat-label">Max Rating</span>
                <span class="stat-value" id="aside-cf-maxrating"><div class="skeleton skeleton-text short"></div></span>
            </div>
            <div class="stat-item">
                <span class="stat-label">Rank</span>
                <span class="stat-value" id="aside-cf-rank"><div class="skeleton skeleton-text short"></div></span>
            </div>
            <div class="stat-item">
                <span class="stat-label">Solved</span>
                <span class="stat-value" id="aside-cf-solved"><div class="skeleton skeleton-text short"></div></span>
            </div>
        </div>
        <div class="lc-stats-container" style="display: none;">
            <div class="stat-item">
                <span class="stat-label">Total Solved</span>
                <span class="stat-value" id="aside-lc-all"><div class="skeleton skeleton-text short"></div></span>
            </div>
            <div class="stat-item">
                <span class="stat-label">Easy</span>
                <span class="stat-value" id="aside-lc-easy" style="color: #4caf50;"><div class="skeleton skeleton-text short"></div></span>
            </div>
            <div class="stat-item">
                <span class="stat-label">Medium</span>
                <span class="stat-value" id="aside-lc-medium" style="color: #ff9800;"><div class="skeleton skeleton-text short"></div></span>
            </div>
            <div class="stat-item">
                <span class="stat-label">Hard</span>
                <span class="stat-value" id="aside-lc-hard" style="color: #f44336;"><div class="skeleton skeleton-text short"></div></span>
            </div>
        </div>
        <div class="gh-stats-container" style="display: none;">
            <div class="stat-item">
                <span class="stat-label">Followers</span>
                <span class="stat-value" id="aside-gh-followers"><div class="skeleton skeleton-text short"></div></span>
            </div>
            <div class="stat-item">
                <span class="stat-label">Public Repos</span>
                <span class="stat-value" id="aside-gh-repos"><div class="skeleton skeleton-text short"></div></span>
            </div>
            <div class="stat-item">
                <span class="stat-label">Following</span>
                <span class="stat-value" id="aside-gh-following"><div class="skeleton skeleton-text short"></div></span>
            </div>
        </div>
    </aside>

    <footer>
        <a href="https://codeforces.com/profile/akcodesalot" target="_blank">MY CODEFORCES PROFILE</a>
        <script>
            document.addEventListener('DOMContentLoaded', () => {
                const modeBtns = document.querySelectorAll('.mode-btn');
                const root = document.documentElement;

                // Apply saved mode on load
                const savedMode = localStorage.getItem('appMode') || 'cf';
                if (savedMode === 'lc') {
                    root.classList.add('lc-mode');
                } else if (savedMode === 'gh') {
                    root.classList.add('gh-mode');
                }

                // Also check if URL starts with /lc or /gh and sync mode just in case
                if (window.location.pathname.startsWith('/lc')) {
                    root.classList.remove('gh-mode');
                    root.classList.add('lc-mode');
                    localStorage.setItem('appMode', 'lc');
                } else if (window.location.pathname.startsWith('/gh')) {
                    root.classList.remove('lc-mode');
                    root.classList.add('gh-mode');
                    localStorage.setItem('appMode', 'gh');
                }

                function updateActiveButton() {
                    let currentMode = 'cf';
                    if (root.classList.contains('lc-mode')) currentMode = 'lc';
                    if (root.classList.contains('gh-mode')) currentMode = 'gh';

                    const triggerBtn = document.querySelector('.dropdown-trigger');
                    if (triggerBtn) {
                        triggerBtn.textContent = `MODE: ${currentMode.toUpperCase()} ▼`;
                    }

                    modeBtns.forEach(btn => {
                        if (btn.dataset.mode === currentMode) {
                            btn.classList.add('active-mode');
                        } else {
                            btn.classList.remove('active-mode');
                        }
                    });
                }

                modeBtns.forEach(btn => {
                    btn.addEventListener('click', () => {
                        const targetMode = btn.dataset.mode;
                        const currentPath = window.location.pathname;
                        
                        let currentMode = 'cf';
                        if (root.classList.contains('lc-mode')) currentMode = 'lc';
                        if (root.classList.contains('gh-mode')) currentMode = 'gh';

                        if (targetMode === currentMode) {
                            return; // Do nothing if already in this mode
                        }

                        let newPath = '/';
                        if (targetMode === 'cf') {
                            localStorage.setItem('appMode', 'cf');
                            if (currentPath.startsWith('/lc') || currentPath.startsWith('/gh')) {
                                if (currentPath.endsWith('/view')) newPath = '/view';
                                else if (currentPath.endsWith('/coach')) newPath = '/coach';
                                else if (currentPath.endsWith('/roadmap') || currentPath.endsWith('/tools')) newPath = '/sort';
                                else newPath = '/';
                            } else {
                                newPath = currentPath;
                            }
                        } else if (targetMode === 'lc') {
                            localStorage.setItem('appMode', 'lc');
                            if (!currentPath.startsWith('/lc')) {
                                if (currentPath.endsWith('/view')) newPath = '/lc/view';
                                else if (currentPath.endsWith('/coach')) newPath = '/lc/coach';
                                else if (currentPath === '/sort' || currentPath.endsWith('/roadmap') || currentPath.endsWith('/tools')) newPath = '/lc/roadmap';
                                else newPath = '/lc';
                            } else {
                                newPath = currentPath;
                            }
                        } else if (targetMode === 'gh') {
                            localStorage.setItem('appMode', 'gh');
                            if (!currentPath.startsWith('/gh')) {
                                if (currentPath.endsWith('/view')) newPath = '/gh/view';
                                else if (currentPath.endsWith('/coach')) newPath = '/gh/coach';
                                else if (currentPath === '/sort' || currentPath.endsWith('/roadmap') || currentPath.endsWith('/tools')) newPath = '/gh/tools';
                                else newPath = '/gh';
                            } else {
                                newPath = currentPath;
                            }
                        }

                        if (window.motionAnimate) {
                            window.motionAnimate("body", { opacity: 0, filter: "blur(4px)", y: -10 }, { duration: 0.3 }).then(() => {
                                window.location.href = newPath;
                            });
                        } else {
                            window.location.href = newPath;
                        }
                    });
                });

                function updateSprites() {
                    let mode = 'cf';
                    if (root.classList.contains('lc-mode')) mode = 'lc';
                    if (root.classList.contains('gh-mode')) mode = 'gh';

                    // For home.html main sprite
                    const homeSprite = document.querySelector('.floating-rayquaza');
                    if (homeSprite) {
                        if (mode === 'lc') {
                            homeSprite.src = 'https://play.pokemonshowdown.com/sprites/gen5ani/groudon.gif';
                            homeSprite.alt = 'Groudon';
                        } else if (mode === 'gh') {
                            homeSprite.src = 'https://play.pokemonshowdown.com/sprites/gen5ani/kyogre.gif';
                            homeSprite.alt = 'Kyogre';
                        } else {
                            homeSprite.src = 'https://play.pokemonshowdown.com/sprites/gen5ani/rayquaza.gif';
                            homeSprite.alt = 'Rayquaza';
                        }
                    }

                    // For home.html secondary sprite
                    const cuteSprite = document.querySelector('.cute-sprite');
                    if (cuteSprite) {
                        if (mode === 'lc') {
                            cuteSprite.src = 'https://play.pokemonshowdown.com/sprites/gen5ani/pichu.gif';
                            cuteSprite.alt = 'Pichu';
                        } else if (mode === 'gh') {
                            cuteSprite.src = 'https://play.pokemonshowdown.com/sprites/gen5ani/lotad.gif';
                            cuteSprite.alt = 'Lotad';
                        } else {
                            cuteSprite.src = 'https://play.pokemonshowdown.com/sprites/gen5ani/eevee.gif';
                            cuteSprite.alt = 'Eevee';
                        }
                    }
                }

                function updateLinks() {
                    let mode = 'cf';
                    if (root.classList.contains('lc-mode')) mode = 'lc';
                    if (root.classList.contains('gh-mode')) mode = 'gh';

                    const navLinks = document.querySelectorAll('nav a');
                    const sortLink = document.querySelector('.sort-link');
                    const roadmapLink = document.querySelector('.roadmap-link');
                    const coachLink = document.querySelector('.coach-link');
                    const footerLink = document.querySelector('footer a');

                    if (mode === 'lc') {
                        if (navLinks[0]) { navLinks[0].href = '/lc'; navLinks[0].textContent = 'Home'; }
                        if (navLinks[1]) { navLinks[1].href = '/lc/view'; navLinks[1].textContent = 'View'; }
                        if (sortLink) { sortLink.style.display = 'none'; }
                        if (roadmapLink) { roadmapLink.style.display = 'inline-block'; roadmapLink.href = '/lc/roadmap'; roadmapLink.textContent = 'Roadmap'; }
                        if (coachLink) { coachLink.href = '/lc/coach'; coachLink.textContent = 'Coach'; }
                        if (footerLink) {
                            footerLink.href = 'https://leetcode.com/u/isaidduh/';
                            footerLink.textContent = 'MY LEETCODE PROFILE';
                        }
                    } else if (mode === 'gh') {
                        if (navLinks[0]) { navLinks[0].href = '/gh'; navLinks[0].textContent = 'Home'; }
                        if (navLinks[1]) { navLinks[1].href = '/gh/view'; navLinks[1].textContent = 'View'; }
                        if (sortLink) { sortLink.style.display = 'none'; }
                        if (roadmapLink) { roadmapLink.style.display = 'inline-block'; roadmapLink.href = '/gh/tools'; roadmapLink.textContent = 'Tools'; }
                        if (coachLink) { coachLink.style.display = 'inline-block'; coachLink.href = '/gh/coach'; coachLink.textContent = 'Coach'; }
                        if (footerLink) {
                            footerLink.href = 'https://github.com/Ankush-nsut29';
                            footerLink.textContent = 'MY GITHUB PROFILE';
                        }
                    } else {
                        if (navLinks[0]) { navLinks[0].href = '/'; navLinks[0].textContent = 'Home'; }
                        if (navLinks[1]) { navLinks[1].href = '/view'; navLinks[1].textContent = 'View'; }
                        if (sortLink) { sortLink.style.display = 'inline-block'; }
                        if (roadmapLink) { roadmapLink.style.display = 'inline-block'; roadmapLink.href = '/cf/roadmap'; roadmapLink.textContent = 'A2OJ'; }
                        if (coachLink) { coachLink.style.display = 'inline-block'; coachLink.href = '/coach'; coachLink.textContent = 'Coach'; }
                        if (footerLink) {
                            footerLink.href = 'https://codeforces.com/profile/akcodesalot';
                            footerLink.textContent = 'MY CODEFORCES PROFILE';
                        }
                    }
                }

                updateSprites();
                updateLinks();
                updateActiveButton();

                // Fetch Stats via AJAX based on current mode
                function fetchStats() {
                    let mode = 'cf';
                    if (root.classList.contains('lc-mode')) mode = 'lc';
                    if (root.classList.contains('gh-mode')) mode = 'gh';

                    fetch(`/api/stats/${mode}`)
                        .then(res => res.json())
                        .then(data => {
                            if (mode === 'cf') {
                                document.getElementById('aside-cf-rating').textContent = data.rating || 'N/A';
                                document.getElementById('aside-cf-maxrating').textContent = data.maxRating || 'N/A';
                                document.getElementById('aside-cf-rank').textContent = data.rank || 'N/A';
                                document.getElementById('aside-cf-solved').textContent = data.total_solved || 0;
                            } else if (mode === 'lc') {
                                document.getElementById('aside-lc-all').textContent = data.All || 0;
                                document.getElementById('aside-lc-easy').textContent = data.Easy || 0;
                                document.getElementById('aside-lc-medium').textContent = data.Medium || 0;
                                document.getElementById('aside-lc-hard').textContent = data.Hard || 0;
                            } else if (mode === 'gh') {
                                document.getElementById('aside-gh-followers').textContent = data.followers || 0;
                                document.getElementById('aside-gh-repos').textContent = data.public_repos || 0;
                                document.getElementById('aside-gh-following').textContent = data.following || 0;
                            }
                        })
                        .catch(err => console.error("Error fetching stats:", err));
                }

                // Call once on load
                fetchStats();
            });
        </script>
        
        <script type="module">
            import { animate } from "https://cdn.jsdelivr.net/npm/motion@11.11.13/+esm";
            
            // Expose animate globally so the mode switcher can use it
            window.motionAnimate = animate;
            
            // 1. Enter Animation
            // Fade in the body (overriding the opacity: 0 in <head>)
            animate("body", { opacity: [0, 1] }, { duration: 0.4 });
            // Slide up the main content and aside for a dynamic feel
            animate("main", { opacity: [0, 1], y: [20, 0] }, { duration: 0.5, type: "spring", bounce: 0.3 });
            animate("aside", { opacity: [0, 1], x: [20, 0] }, { duration: 0.5, delay: 0.1, type: "spring", bounce: 0.3 });

            // 2. Exit Animation for navigation links
            document.querySelectorAll('nav a').forEach(link => {
                link.addEventListener('click', (e) => {
                    // Don't intercept if opening in new tab or same page
                    if (link.target === '_blank' || link.href === window.location.href) return;
                    
                    e.preventDefault();
                    animate("body", { opacity: 0, filter: "blur(4px)", y: -10 }, { duration: 0.3 }).then(() => {
                        window.location.href = link.href;
                    });
                });
            });

            // 3. Handle bfcache (browser back button)
            window.addEventListener('pageshow', (event) => {
                if (event.persisted) {
                    document.body.style.opacity = 1;
                    document.body.style.filter = "none";
                    document.body.style.transform = "none";
                    animate("body", { opacity: [0, 1] }, { duration: 0.4 });
                }
            });
        </script>
</body>

</html>
